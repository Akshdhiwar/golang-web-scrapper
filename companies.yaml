# companies.yaml — company career pages scanned by the "careers" source.
#
# Each company must host its jobs on a public ATS board:
#   greenhouse → https://boards-api.greenhouse.io/v1/boards/<slug>/jobs
#   lever      → https://api.lever.co/v0/postings/<slug>?mode=json
#   ashby      → https://api.ashbyhq.com/posting-api/job-board/<slug>
# Find the slug in the company's careers URL (e.g. boards.greenhouse.io/stripe,
# jobs.lever.co/zeta, jobs.ashbyhq.com/openai). All slugs below were checked
# on 2026-11-22; each profile's filters decide which of their jobs you get.

