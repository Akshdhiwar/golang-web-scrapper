name: Job Scraper

on:
  schedule:
    - cron: "0 * * * *"   # every hour
  workflow_dispatch:        # manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-22.04  # pinned: ubuntu-latest (24.04) breaks libasound2
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ hashFiles('go.sum') }}

      - name: Install Playwright + Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: go run github.com/playwright-community/playwright-go/cmd/playwright install --with-deps chromium

      - name: Install Playwright system deps only
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: go run github.com/playwright-community/playwright-go/cmd/playwright install-deps chromium

      - name: Build
        run: go build -ldflags="-w -s" -o ./scraper ./cmd/main.go

      - name: Run
        env:
          DATABASE_URL:            ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN:      ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:        ${{ secrets.TELEGRAM_CHAT_ID }}
          KEYWORDS:                ${{ vars.SCRAPER_KEYWORDS }}
          LOCATIONS:               ${{ vars.SCRAPER_LOCATIONS }}
          MAX_PAGES:               ${{ vars.MAX_PAGES }}
          MIN_DELAY_SECONDS:       ${{ vars.MIN_DELAY_SECONDS }}
          MAX_DELAY_SECONDS:       ${{ vars.MAX_DELAY_SECONDS }}
          MAX_RETRIES:             ${{ vars.MAX_RETRIES }}
          NOTIFICATION_BATCH_SIZE: ${{ vars.NOTIFICATION_BATCH_SIZE }}
          RUN_ONCE:                "true"
        run: |
          START=$(date +%s)
          ./scraper
          echo "Done in $(( $(date +%s) - START ))s"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_number }}
          path: "*.log"
          retention-days: 7
