name: Job Scraper

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # ── Cache 1: compiled binary (keyed on all Go source + deps) ──
      # On cache hit the entire Go setup + build step is skipped
      - name: Cache binary
        id: bin-cache
        uses: actions/cache@v4
        with:
          path: ./scraper
          key: scraper-bin-${{ hashFiles('**/*.go', 'go.sum') }}

      # ── Cache 2: Playwright Chromium browser & Driver ──────────────
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/ms-playwright-go
          key: pw-chromium-${{ hashFiles('go.sum') }}

      # ── Only needed when either cache misses ───────────────────────
      - uses: actions/setup-go@v5
        if: steps.bin-cache.outputs.cache-hit != 'true' || steps.pw-cache.outputs.cache-hit != 'true'
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        if: steps.bin-cache.outputs.cache-hit != 'true'
        run: go build -ldflags="-w -s" -o ./scraper ./cmd/main.go

      - name: Install Playwright + Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: go run github.com/playwright-community/playwright-go/cmd/playwright install --with-deps chromium

      # ── Run ────────────────────────────────────────────────────────
      - name: Run scraper
        env:
          DATABASE_URL:            ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN:      ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:        ${{ secrets.TELEGRAM_CHAT_ID }}
          KEYWORDS:                ${{ vars.SCRAPER_KEYWORDS }}
          LOCATIONS:               ${{ vars.SCRAPER_LOCATIONS }}
          MAX_PAGES:               ${{ vars.MAX_PAGES }}
          MIN_DELAY_SECONDS:       ${{ vars.MIN_DELAY_SECONDS }}
          MAX_DELAY_SECONDS:       ${{ vars.MAX_DELAY_SECONDS }}
          MAX_RETRIES:             ${{ vars.MAX_RETRIES }}
          NOTIFICATION_BATCH_SIZE: ${{ vars.NOTIFICATION_BATCH_SIZE }}
          RUN_ONCE:                "true"
        run: |
          START=$(date +%s)
          ./scraper
          echo "Done in $(( $(date +%s) - START ))s"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_number }}
          path: "*.log"
          retention-days: 7
