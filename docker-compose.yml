version: "3.9"

services:
  scraper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobscraper_app
    restart: unless-stopped

    env_file:
      - .env

    volumes:
      - scraper_logs:/app/logs
      # File store (used when DATABASE_URL is empty in .env)
      - scraper_data:/app/.data

volumes:
  scraper_logs:
  scraper_data: